[build]
  command = "npm install --prefix tasker && npm install --prefix tasker-frontend && npm run build --prefix tasker-frontend"
  publish = "tasker-frontend/build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
