version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./tasker
      dockerfile: Dockerfile
    container_name: tasker-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI: ${MONGODB_URI}
      - JWT_SECRET: ${JWT_SECRET}
      - JWT_EXPIRE=7d
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
    restart: unless-stopped
    networks:
      - tasker-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - ./tasker:/app
      - /app/node_modules

  # Frontend Service
  frontend:
    build:
      context: ./tasker-frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:5000
    container_name: tasker-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - tasker-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./tasker-frontend:/app
      - /app/node_modules

networks:
  tasker-network:
    driver: bridge

# Volumes (optional, if using MongoDB container)
# volumes:
#   mongodb_data:
#     driver: local
