version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./tasker
      dockerfile: Dockerfile
    image: mhknigam2710/tasker-backend:latest
    container_name: tasker-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://tasker_user:3J4aDyhKmPL2Rf@cluster03.nm2ebgb.mongodb.net/tasker?retryWrites=true&w=majority&appName=Cluster03}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      - JWT_EXPIRE=7d
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
    restart: unless-stopped
    networks:
      - tasker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (Development Mode)
  frontend:
    build:
      context: ./tasker-frontend
      dockerfile: Dockerfile
    image: mhknigam2710/tasker-frontend:latest
    container_name: tasker-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:5000
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    networks:
      - tasker-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  tasker-network:
    driver: bridge
